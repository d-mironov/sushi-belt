[package]
name = "sushi-belt"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/d-mironov/sushi-belt"
description = "A fixed-capacity ring buffer for embedded Rust, written entirely in safe code"
readme = "README.md"
keywords = ["ring-buffer", "circular-buffer", "fifo", "no-std", "embedded"]
categories = ["data-structures", "embedded", "no-std", "no-std::no-alloc"]

[dependencies]
defmt = { version = "1", optional = true }

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[features]
defmt = ["dep:defmt"]

[package.metadata.docs.rs]
all-features = true
