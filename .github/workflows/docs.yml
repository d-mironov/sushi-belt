name: Docs

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --locked --no-deps --all-features
      - run: echo '<meta http-equiv="refresh" content="0; url=sushi_belt/">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
      - id: deployment
        uses: actions/deploy-pages@v5
